name: Sync upstream

# ============================================================
# 可选：把上游仓库代码同步到自己的 fork
#
# 注意：这个 workflow 只用于「看代码方便」，不参与镜像构建。
# 原因：GITHUB_TOKEN 推送的 commit 不会触发其他 workflow。
# 镜像构建由 build-dsh.yml 独立轮询上游 release 完成。
#
# 如果你只是要构建镜像，这个文件可以不要。
# ============================================================

on:
  schedule:
    - cron: '23 3 * * *'   # 每天 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  UPSTREAM_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UPSTREAM_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

      - name: Fetch upstream
        run: git fetch upstream "${UPSTREAM_BRANCH}" --tags --prune

      - name: Fast-forward if possible
        id: ff
        run: |
          set -euo pipefail

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "已是最新，无需同步"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 检查能否快进（fork 上没有本地改动时总是可以）
          if git merge-base --is-ancestor "$LOCAL" "$REMOTE"; then
            echo "可快进合并: $LOCAL -> $REMOTE"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "mode=ff" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::历史已分叉，需要人工处理（fork 上有本地提交？）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "mode=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Push fast-forward
        if: steps.ff.outputs.changed == 'true'
        run: |
          git merge --ff-only "upstream/${UPSTREAM_BRANCH}"
          git push origin "${UPSTREAM_BRANCH}"

      - name: Push tags
        if: steps.ff.outputs.changed == 'true'
        run: git push origin --tags

      - name: Summary
        run: |
          {
            echo "### 上游同步结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 模式 | \`${{ steps.ff.outputs.mode }}\` |"
            echo "| 是否有变更 | \`${{ steps.ff.outputs.changed }}\` |"
            echo "| 当前 HEAD | \`$(git rev-parse --short HEAD)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
