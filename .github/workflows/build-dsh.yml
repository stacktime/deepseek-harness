name: Build dsh image

# ============================================================
# 两种触发方式：
#   1. 定时轮询（主力）：每 6 小时查一次上游 release，有新版就构建
#   2. 手动：填任意版本号立即构建（补历史版本/重跑失败）
#
# 为什么不用 fork 同步来触发：
#   GITHUB_TOKEN 推送的 commit 不会触发 workflow（GitHub 防递归机制），
#   用 fork 同步当触发器不可靠。直接读上游 release 更稳，且与 fork 解耦。
# ============================================================

on:
  schedule:
    # 每 6 小时，UTC 时间。官方发版后最迟 6 小时内自动出镜像
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'dsh 版本号（不带 dsh-v 前缀，如 0.2.3-alpha.1）；留空则取上游最新 release'
        required: false
        type: string
      force:
        description: '强制重建（镜像已存在也重新构建）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dsh

jobs:
  resolve-version:
    name: Resolve upstream version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            # 手动指定版本
            VERSION="${INPUT_VERSION}"
            # 允许用户误带 dsh-v 前缀
            VERSION="${VERSION#dsh-v}"
            echo "使用手动指定版本: ${VERSION}"
          else
            # 取上游版本号
            #
            # 注意：不能用 /releases/latest
            #   该接口只返回「非预发布」的正式版；dsh 目前所有 release
            #   都标记为 prerelease（alpha/rc），所以该接口恒返回 404。
            #
            # 改用 /releases 列表 + 本地按 semver 排序取最高版本。
            # 不用列表第一个，是因为「最近发布」可能是在老分支上补的
            # rc 版本，会导致版本回退。
            RELEASES_JSON=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=50") || {
                echo "::error::调用 GitHub API 失败"
                exit 1
              }

            ALL_VERSIONS=$(echo "${RELEASES_JSON}" \
              | grep -oP '"tag_name":\s*"\K[^"]+' \
              | sed 's/^dsh-v//' \
              | grep -P '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$' \
              || true)

            if [ -z "${ALL_VERSIONS}" ]; then
              echo "::error::上游 release 列表为空或格式不匹配"
              echo "原始响应前 500 字符："
              echo "${RELEASES_JSON}" | head -c 500
              exit 1
            fi

            echo "上游可选版本（sort -V 排序后）："
            echo "${ALL_VERSIONS}" | sort -V | sed 's/^/  /'

            VERSION=$(echo "${ALL_VERSIONS}" | sort -V | tail -1)
            echo "选中版本: ${VERSION}"
          fi

          # 校验版本号格式（允许 semver + 预发布后缀）
          if ! echo "${VERSION}" | grep -qP '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号格式非法: ${VERSION}"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if image already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ "${FORCE:-false}" = "true" ]; then
            echo "强制重建，跳过存在性检查"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 查 GHCR 上是否已有该版本 tag
          #
          # 注意：这一步是「优化」（避免重复构建），不是「必要条件」。
          # 任何异常（包不存在时匿名 token 会被 403 拒绝、网络抖动、
          # 首次构建时包还不存在）都必须降级为「需要构建」，不能中断 job。

          CODE="000"

          # 1) 取匿名 pull token（包首次不存在时 GHCR 返回 403，属正常）
          TOKEN=$(curl -sS --max-time 20 \
            "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io" \
            2>/dev/null \
            | grep -oP '"token":\s*"\K[^"]+' || true)

          if [ -n "${TOKEN}" ]; then
            # 2) 用 token 查 manifest 是否存在
            CODE=$(curl -sS --max-time 20 -o /dev/null \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${VERSION}" \
              2>/dev/null || echo "000")
            echo "GHCR manifest 查询结果: HTTP ${CODE}"
          else
            echo "GHCR token 获取失败（包可能尚不存在），视为需要构建"
          fi

          if [ "${CODE}" = "200" ]; then
            echo "镜像 ${VERSION} 已存在，跳过构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "镜像 ${VERSION} 未找到（HTTP ${CODE}），准备构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.resolve-version.outputs.version }}
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 只打两个 tag：具体版本号 + latest
          # 不额外打 sha-<commit> tag —— 每次构建都会新增一个，会让 tag 列表逐渐变长。
          # 需要追溯某次构建时，用 Actions 页面（run 记录里有 commit sha 和镜像 digest）。
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=DeepSeek Harness
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
          build-args: |
            DSH_VERSION=${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance / sbom 关闭说明：
          #   开启时，每个架构额外生成一个 attestation manifest，其内部含
          #   2 个 layer（SBOM 证明 + provenance 证明）+ 1 个空配置 blob。
          #   在 GHCR 的 versions 页面表现为多个 untagged 条目，
          #   两个架构合计约 5 个 untagged。
          #   个人自用镜像无需供应链证明，关闭后 versions 只剩
          #   amd64 / arm64 两个真正的镜像条目。
          provenance: true
          sbom: true

      - name: Smoke test image
        run: |
          set -euo pipefail

          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-version.outputs.version }}"
          echo "start smoke test with ${IMG}"

          docker run -d --name dsh-smoke -p 3080:3080 "${IMG}"

          # 注意：dsh 首页 302 到 /?token=xxx，curl -f 会把 3xx 判为失败。
          # 这里只看是否拿到 HTTP 响应码（非 000 即视为已监听）。
          READY=false
          for i in $(seq 1 90); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 \
              http://127.0.0.1:3080/ 2>/dev/null || echo "000")
            if [ "${CODE}" != "000" ]; then
              echo "smoke test passed after $((i*2))s (HTTP ${CODE})"
              READY=true
              break
            fi
            if ! docker ps --filter name=dsh-smoke --filter status=running -q | grep -q .; then
              echo "::error::container exited unexpectedly"
              break
            fi
            sleep 2
          done

          echo "--- container logs ---"
          docker logs dsh-smoke 2>&1 | tail -60 || true

          docker rm -f dsh-smoke >/dev/null 2>&1 || true

          if [ "${READY}" != "true" ]; then
            echo "::error::smoke test failed - service did not respond on :3080"
            exit 1
          fi

      - name: Prune legacy sha-* tags
        # 历史遗留：早期配置给每次构建额外打了 sha-<commit> tag。
        # 这里清掉它们，只保留「版本号」和「latest」。
        # 注意：删除 tag 不会删除镜像层（同一个 digest 仍被版本号 tag 引用）。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          KEEP_VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "保留 tag: ${KEEP_VERSION}, latest"

          # 列出全部 tag
          TOKEN=$(curl -sS --max-time 20 \
            "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull,delete&service=ghcr.io" \
            2>/dev/null | grep -oP '"token":\s*"\K[^"]+' || true)

          if [ -z "${TOKEN}" ]; then
            echo "::warning::无法获取 GHCR token，跳过清理"
            exit 0
          fi

          TAGS=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${IMAGE_NAME}/tags/list" 2>/dev/null \
            | grep -oP '"tags":\[[^\]]*\]' \
            | grep -oP '"[^"]+"' | tr -d '"' | grep -v '^tags$' || true)

          echo "当前 tags:"
          echo "${TAGS}" | sed 's/^/  /'

          DELETED=0
          for TAG in ${TAGS}; do
            case "${TAG}" in
              latest|"${KEEP_VERSION}")
                continue
                ;;
              sha-*)
                echo "删除 legacy tag: ${TAG}"
                CODE=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X DELETE \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
                  "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${TAG}" 2>/dev/null || echo "000")
                echo "  -> HTTP ${CODE}"
                DELETED=$((DELETED+1))
                ;;
              *)
                # 其他历史版本号 tag：默认保留（可作为回滚点）
                echo "保留历史版本 tag: ${TAG}"
                ;;
            esac
          done

          echo "已清理 ${DELETED} 个 sha-* tag"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### dsh 镜像构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`${{ needs.resolve-version.outputs.version }}\` |"
            echo "| 镜像 | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-version.outputs.version }}\` |"
            echo "| 平台 | linux/amd64, linux/arm64 |"
            echo "| 状态 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
